services:
  db:
    image: postgres:17.11@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SKIW_MIGRATOR_PASSWORD: ${SKIW_MIGRATOR_PASSWORD:?set in .env}
      SKIW_APP_PASSWORD: ${SKIW_APP_PASSWORD:?set in .env}
    volumes:
      - ./docker/postgres/10-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
      - ./infra/host/db/roles.sql:/skiw/roles.sql:ro
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${SKIW_DB_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    command: >-
      uvicorn config.asgi:application --host 0.0.0.0 --port 8000
      --reload --reload-dir /srv/app --lifespan off
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-0}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DATABASE_URL: postgres://skiw_app:${SKIW_APP_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      SKIW_SESSION_ABSOLUTE_H: ${SKIW_SESSION_ABSOLUTE_H:?set in .env}
      SKIW_SESSION_IDLE_MIN: ${SKIW_SESSION_IDLE_MIN:?set in .env}
      TENANT_SOURCE_KEY: ${TENANT_SOURCE_KEY:?set in .env}
      SKIW_ARGON2_MEMORY_KIB: ${SKIW_ARGON2_MEMORY_KIB:?set in .env}
      SKIW_ARGON2_TIME_COST: ${SKIW_ARGON2_TIME_COST:?set in .env}
      SKIW_ARGON2_PARALLELISM: ${SKIW_ARGON2_PARALLELISM:?set in .env}
      SKIW_AUTH_FAILS_PER_ACCOUNT: ${SKIW_AUTH_FAILS_PER_ACCOUNT:?set in .env}
      SKIW_AUTH_FAILS_PER_IP: ${SKIW_AUTH_FAILS_PER_IP:?set in .env}
      SKIW_AUTH_WINDOW_MIN: ${SKIW_AUTH_WINDOW_MIN:?set in .env}
      SKIW_AUTH_LOCK_AFTER: ${SKIW_AUTH_LOCK_AFTER:?set in .env}
      SKIW_AUTH_LOCK_MIN: ${SKIW_AUTH_LOCK_MIN:?set in .env}
      SKIW_STEPUP_MAX_AGE_MIN: ${SKIW_STEPUP_MAX_AGE_MIN:?set in .env}
      SKIW_TOTP_SKEW_STEPS: ${SKIW_TOTP_SKEW_STEPS:?set in .env}
      SKIW_LOGIN_PENDING_MIN: ${SKIW_LOGIN_PENDING_MIN:?set in .env}
      SKIW_ENROL_LINK_MIN: ${SKIW_ENROL_LINK_MIN:?set in .env}
      SKIW_PW_MIN_LENGTH: ${SKIW_PW_MIN_LENGTH:?set in .env}
      SKIW_DEPLOYMENT_AGENCY_ID: ${SKIW_DEPLOYMENT_AGENCY_ID:?set in .env}
      SKIW_DEPLOYMENT_AGENCY_NAME: ${SKIW_DEPLOYMENT_AGENCY_NAME:?set in .env}
      SKIW_WEBAUTHN_RP_ID: ${SKIW_WEBAUTHN_RP_ID:?set in .env}
      SKIW_WEBAUTHN_ORIGIN: ${SKIW_WEBAUTHN_ORIGIN:?set in .env}
      LOGIN_BLOB_KEY: ${LOGIN_BLOB_KEY:?set in .env}
      TENANT_TOKEN_KEY: ${TENANT_TOKEN_KEY:?set in .env}
    volumes:
      - ./app:/srv/app:ro
      - ./web/dist:/srv/web/dist:ro
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python app/manage.py runworker
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DATABASE_URL: postgres://skiw_app:${SKIW_APP_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      SKIW_SESSION_ABSOLUTE_H: ${SKIW_SESSION_ABSOLUTE_H:?set in .env}
      SKIW_SESSION_IDLE_MIN: ${SKIW_SESSION_IDLE_MIN:?set in .env}
      TENANT_SOURCE_KEY: ${TENANT_SOURCE_KEY:?set in .env}
      SKIW_ARGON2_MEMORY_KIB: ${SKIW_ARGON2_MEMORY_KIB:?set in .env}
      SKIW_ARGON2_TIME_COST: ${SKIW_ARGON2_TIME_COST:?set in .env}
      SKIW_ARGON2_PARALLELISM: ${SKIW_ARGON2_PARALLELISM:?set in .env}
      SKIW_AUTH_FAILS_PER_ACCOUNT: ${SKIW_AUTH_FAILS_PER_ACCOUNT:?set in .env}
      SKIW_AUTH_FAILS_PER_IP: ${SKIW_AUTH_FAILS_PER_IP:?set in .env}
      SKIW_AUTH_WINDOW_MIN: ${SKIW_AUTH_WINDOW_MIN:?set in .env}
      SKIW_AUTH_LOCK_AFTER: ${SKIW_AUTH_LOCK_AFTER:?set in .env}
      SKIW_AUTH_LOCK_MIN: ${SKIW_AUTH_LOCK_MIN:?set in .env}
      SKIW_STEPUP_MAX_AGE_MIN: ${SKIW_STEPUP_MAX_AGE_MIN:?set in .env}
      SKIW_TOTP_SKEW_STEPS: ${SKIW_TOTP_SKEW_STEPS:?set in .env}
      SKIW_LOGIN_PENDING_MIN: ${SKIW_LOGIN_PENDING_MIN:?set in .env}
      SKIW_ENROL_LINK_MIN: ${SKIW_ENROL_LINK_MIN:?set in .env}
      SKIW_PW_MIN_LENGTH: ${SKIW_PW_MIN_LENGTH:?set in .env}
      SKIW_DEPLOYMENT_AGENCY_ID: ${SKIW_DEPLOYMENT_AGENCY_ID:?set in .env}
      SKIW_DEPLOYMENT_AGENCY_NAME: ${SKIW_DEPLOYMENT_AGENCY_NAME:?set in .env}
      LOGIN_BLOB_KEY: ${LOGIN_BLOB_KEY:?set in .env}
      TENANT_TOKEN_KEY: ${TENANT_TOKEN_KEY:?set in .env}
    # The image's HEALTHCHECK probes the web port, which the worker does not serve.
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
