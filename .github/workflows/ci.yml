name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.24"
          enable-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Unit tests
        run: make test
      - name: Live database role checks
        # Disposable Postgres via Compose, migrate as skiw_migrator, then assert the real app
        # connection reports current_user = skiw_app (TEN-01/02).
        run: make test-live
      - name: Install browser
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: End-to-end tests
        # Builds the web shell, starts Compose (db + app), runs Playwright on desktop and mobile widths.
        run: make e2e
      - name: Stop Compose
        if: always()
        run: docker compose down -v

  # Compensating controls for the GitHub Free private-repo plan (no push protection, CodeQL or
  # dependency-review): docs/runbooks/ci.md. Each step is a Makefile target that runs locally too.
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history
          persist-credentials: false
      - name: Install gitleaks v8.30.1 (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          # From gitleaks_8.30.1_checksums.txt of the v8.30.1 release.
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          sudo tar -xzf "$archive" -C /usr/local/bin gitleaks
          gitleaks version
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.24"
          enable-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Secret scan (full history)
        run: make secrets
      - name: Secret rule test (each key name is flagged)
        run: make secrets-test
      - name: Python dependency audit
        run: make audit-python
      - name: Web dependency audit
        run: make audit-web
      - name: Semgrep registry rulesets
        # Anonymous: no login, no metrics (UNI-11). The custom rules in semgrep/ run in `make lint`.
        run: >-
          uvx semgrep==1.179.0 --config p/python --config p/django --config p/typescript
          --config p/react --metrics=off --error app infra/host web/src

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        # Includes the web build stage and the manifest verification; nothing is pushed.
        run: docker build -t skiw-platform:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: skiw-platform:ci
          version: v0.75.0
          severity: HIGH,CRITICAL
          exit-code: "1"

  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.24"
          enable-cache: false
      - name: Host tooling tests
        # infra/host unit tests (spec section 8.4); no Docker daemon, no host, no secrets.
        run: make host-test
      - name: Live host stack tests
        # Builds the app image, runs caddy + web + db from infra/host/compose.yml with a CI-only
        # Caddyfile (internal CA), loopback ports and secrets generated per run; nothing is pushed.
        run: make host-test-live
