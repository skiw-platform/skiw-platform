name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.24"
          enable-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Typecheck
        run: make typecheck
      - name: Unit tests
        run: make test
      - name: Live database role checks
        # Disposable Postgres via Compose, migrate as skiw_migrator, then assert the real app
        # connection reports current_user = skiw_app (TEN-01/02).
        run: make test-live
      - name: Install browser
        run: pnpm -C web exec playwright install --with-deps chromium
      - name: End-to-end tests
        # Builds the web shell, starts Compose (db + app), runs Playwright on desktop and mobile widths.
        run: make e2e
      - name: Stop Compose
        if: always()
        run: docker compose down -v
