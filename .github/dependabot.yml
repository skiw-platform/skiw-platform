# Weekly dependency updates; minor and patch updates are grouped to limit noise.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: docker-compose
    directories: [/, /infra/host]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
