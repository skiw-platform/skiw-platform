rules:
  - id: auth-tables-accounts-only
    languages: [python]
    severity: ERROR
    message: >-
      Only accounts.auth writes auth_throttle, security_event and (from M3h) auth_stepup (spec
      §4.1, TEN-03, TEN-10, PROJECT.md §9): their keys are HMACs, security_event and auth_stepup
      are append-only evidence. Write them only from code in accounts.auth, never through the
      models or SQL elsewhere; the accounts tests change rows by SQL on purpose.
    paths:
      exclude:
        - /app/accounts/auth/
        - /app/accounts/migrations/
        - /app/accounts/tests/
    pattern-either:
      - pattern: AuthThrottle.objects
      - pattern: SecurityEvent.objects
      - pattern: AuthThrottle(...)
      - pattern: SecurityEvent(...)
      - pattern: accounts.models.AuthThrottle.objects
      - pattern: accounts.models.SecurityEvent.objects
      - pattern: accounts.models.AuthThrottle(...)
      - pattern: accounts.models.SecurityEvent(...)
      - pattern: accounts.auth.tables.AuthThrottle.objects
      - pattern: accounts.auth.tables.SecurityEvent.objects
      - pattern: accounts.auth.tables.AuthThrottle(...)
      - pattern: accounts.auth.tables.SecurityEvent(...)
      - patterns:
          - pattern: '"$SQL"'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)\b(insert|update|delete|truncate|copy|merge|alter|drop|grant|revoke|lock)\b.*\b(auth_throttle|security_event|auth_stepup)\b
