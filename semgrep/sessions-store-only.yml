rules:
  - id: sessions-store-only
    languages: [python]
    severity: ERROR
    message: >-
      Only accounts.session touches django_session (spec §4.1, TEN-10, PROJECT.md §9): it stores
      sha256 of the cookie and fixes the absolute deadline. Session.objects (including
      BaseSessionManager.save, which writes a raw key) or SQL naming the table bypasses it. Use
      request.session; the accounts live tests change rows by SQL on purpose.
    paths:
      exclude:
        - /app/accounts/session.py
        - /app/accounts/session_model.py
        - /app/accounts/migrations/
        - /app/accounts/tests/
    pattern-either:
      - pattern: Session.objects
      - pattern: accounts.session_model.Session.objects
      - pattern: accounts.models.Session.objects
      - patterns:
          - pattern: '"$SQL"'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)\b(select|insert|update|delete|truncate|grant|revoke|copy|alter|drop|lock)\b.*\bdjango_session\b
