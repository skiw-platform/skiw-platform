# The tenancy boundaries (spec §4.2 "Tenant binding", TEN-06, TEN-09, TEN-10; plan M4c-2a). One rule
# per allowed-path set. Semgrep matches a metavariable-regex from the start of the value, so ^.*?
# lets the verb sit anywhere in the string (PR 80 P2).
rules:
  - id: tenancy-guard-key-sql
    languages: [python]
    severity: ERROR
    message: >-
      Only tenancy.keys (the migrate-time key writes, M4c-3) and migrations name a guard.*_key
      table in SQL (spec §4.1, §4.2 TEN-10 row: DB-side only guard.* functions read key tables).
      The bare names in a list are fine; SQL that reads or writes the keys is not.
    # accounts/migrations is allowed on purpose: M3e's guard.auth_lookup_login and M3g's
    # guard.auth_lookup_credential live there and read guard.lookup_decoy_key (plan M4c-2a; the
    # auth-tables-accounts-only rule allows the same path for their security_event insert).
    paths:
      exclude:
        - /app/tenancy/keys.py
        - /app/tenancy/migrations/
        - /app/accounts/migrations/
        - /app/tenancy/tests/
        - /app/accounts/tests/
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is)^.*?\b(select|insert|update|delete|truncate|copy|merge|alter|drop|grant|revoke|lock|create|from|into|join|table)\b.*?\bguard"?\s*\.\s*"?\w*_key\b
  - id: tenancy-token-setting
    languages: [python]
    severity: ERROR
    message: >-
      Only tenancy.binding.with_agency() sets app.tenant_token (spec §4.2 item 2: tokens are
      minted only in with_agency() / async_with_agency()).
    # tenancy/tests sets hand-made and forged tokens on purpose (TEN-09 forged-tenant tests; PR 91
    # review R1 P3), with the literal name so tenancy-set-config-name stays without excludes.
    paths:
      exclude:
        - /app/tenancy/binding.py
        - /app/tenancy/async_binding.py
        - /app/tenancy/tests/
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is)^.*?(set_config\s*\(\s*'app\.tenant_token'|\bset\s+local\s+"?app\.tenant_token)
  - id: tenancy-set-config-name
    languages: [python]
    severity: ERROR
    message: >-
      set_config() must name its setting as a quoted literal: a bound or computed name hides
      app.tenant_token from tenancy-token-setting (PR 91 review R1 P3). Banned everywhere.
    patterns:
      - pattern: '"$SQL"'
      - metavariable-regex:
          metavariable: $SQL
          regex: (?is)^.*?\bset_config\s*\((?!\s*'[a-z0-9_.]+'\s*,)
  - id: tenancy-token-mint-import
    languages: [python]
    severity: ERROR
    message: >-
      Only tenancy.binding (and async_binding) may import tenancy.token: the key is in settings, so
      any module holding mint() could make a token for any agency outside with_agency() (PR 91
      review R1 P3; spec §4.2 item 2).
    paths:
      exclude:
        - /app/tenancy/binding.py
        - /app/tenancy/async_binding.py
        - /app/tenancy/tests/
    pattern-either:
      - pattern: import tenancy.token
      - pattern: import tenancy.token as $X
      - pattern: from tenancy.token import $X
      - pattern: from tenancy.token import $X as $Y
      - pattern: from tenancy import token
      - pattern: from tenancy import token as $X
      - pattern: from . import token
      - pattern: from .token import $X
      - pattern: importlib.import_module("tenancy.token", ...)
      - pattern: importlib.import_module(".token", ...)
      - pattern: __import__("tenancy.token", ...)
  - id: tenancy-token-key-reader
    languages: [python]
    severity: ERROR
    message: >-
      Only config.settings (which defines it), tenancy.keys (the migrate-time write) and
      tenancy.binding (and async_binding) read SKIW_TENANT_TOKEN_KEYS: with the key, any module could
      mint a token for any agency outside with_agency(), import rule or not (PR 92 review R1 P3).
      Elsewhere, call tenancy.binding.require_token_key(), which returns nothing; the cached
      binding._token_keys() is private to the binding modules (PR 93 review R1 P3).
    # The string literal catches getattr(settings, "...") and keys.py's KeyTable.setting; the
    # attribute pattern catches settings under any alias. A comment or docstring is not flagged.
    paths:
      exclude:
        - /app/config/settings.py
        - /app/tenancy/keys.py
        - /app/tenancy/binding.py
        - /app/tenancy/async_binding.py
        - /app/tenancy/tests/
    pattern-either:
      - pattern: $S.SKIW_TENANT_TOKEN_KEYS
      - pattern: '"SKIW_TENANT_TOKEN_KEYS"'
      - pattern: $S._token_keys
      - pattern: from tenancy.binding import _token_keys
      - pattern: from tenancy.binding import _token_keys as $A
      - pattern: from .binding import _token_keys
  - id: tenancy-token-key-source
    languages: [python]
    severity: ERROR
    message: >-
      Only config.settings (its reader) and tenancy.keys name the TENANT_TOKEN_KEY variables: any
      other module could read the key from the environment or the secret file (PR 93 review R1 P3).
      The listed tests set or check the variables themselves.
    paths:
      exclude:
        - /app/config/settings.py
        - /app/tenancy/keys.py
        - /app/tenancy/tests/
        - /app/tests/test_env_wiring.py
        - /app/tests/test_startup_key.py
        - /app/jobs/tests/test_worker_key_check.py
    pattern-either:
      - pattern: '"TENANT_TOKEN_KEY"'
      - pattern: '"TENANT_TOKEN_KEY_FILE"'
  - id: tenancy-async-pool
    languages: [python]
    severity: ERROR
    message: >-
      Only tenancy.async_binding holds an AsyncConnectionPool (spec D26, plan M4c-8): every pooled
      async transaction must go through async_with_agency().
    paths:
      exclude:
        - /app/tenancy/async_binding.py
    pattern-regex: \bAsyncConnectionPool\b
  - id: tenancy-no-session-setting
    languages: [python]
    severity: ERROR
    message: >-
      A session-level app.* setting leaks across pooled connections (TEN-09): use only
      set_config(name, value, true) inside with_agency(); plain SET and any set_config() whose last
      argument is not the literal true are banned everywhere (PR 85 review R1 P2: a nested call in the
      value, 'off', 'no', 0 and a bind parameter all give a session-level setting).
    # Branch A. (1) The string holds set_config( and it is NOT made only of calls that end in
    # ", true)": (?1) matches a balanced nested bracket, so a nested call in the value
    # cannot hide the real last argument. (2) Plain SET [SESSION] app.* .
    # Branch B is the first, linear regex (PR 85 review R1 P3, option (a)): branch A hits the
    # engine's backtrack limit on a string over about 10,000 characters and then reports no match
    # and no error, so B still flags every flat false / 'f' / 'false' / 0 and plain SET at any length.
    pattern-either:
      - patterns:
          - pattern: '"$SQL"'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^(?:(?=.*?set_config\s*\()(?!(?:(?!set_config\s*\().)*(?:set_config\s*\((?:[^()]|(\((?:[^()]|(?1))*\)))*?,\s*true\s*\)(?:(?!set_config\s*\().)*)*$)|.*?\bset\s+(?:session\s+)?"?app\.)
      - patterns:
          - pattern: '"$SQL"'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^.*?(set_config\s*\([^)]*,\s*(false|'f'|'false'|0)\s*\)|\bset\s+(session\s+)?"?app\.)
