rules:
  - id: auth-stepup-insert-stepup-only
    languages: [python]
    severity: ERROR
    message: >-
      Only accounts.auth.stepup touches auth_stepup through the ORM or the model (spec §4.1
      "inserted only by accounts.auth (lint)", plan M3 §3 M3h, DECISIONS M3h-2): record() signs
      every row it inserts with evidence_mac, recent() checks that MAC. A row written elsewhere
      carries no valid MAC and authorises nothing, and a read of the model elsewhere would trust a
      row recent() would refuse. Call accounts.auth.stepup; the accounts tests forge rows by SQL on
      purpose. Raw SQL is flagged only when it writes the table (a migration or trigger may read it).
    paths:
      exclude:
        - /app/accounts/auth/stepup.py
        - /app/accounts/migrations/
        - /app/accounts/tests/
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: AuthStepup.$M
              - pattern: accounts.models.AuthStepup.$M
              - pattern: accounts.stepup_model.AuthStepup.$M
          - metavariable-regex:
              metavariable: $M
              regex: ^(objects|_default_manager|_base_manager)$
      - pattern: AuthStepup(...)
      - pattern: accounts.models.AuthStepup(...)
      - pattern: accounts.stepup_model.AuthStepup(...)
      - patterns:
          - pattern-either:
              - pattern: $APPS.get_model("$NAME", ...)
              - pattern: $APPS.get_model($APP, "$NAME", ...)
          - metavariable-regex:
              metavariable: $NAME
              regex: (?i)^(accounts\.)?authstepup$
      # As auth-tables-accounts-only: ^.*? lets the verb sit anywhere in the string (PR 80 P2).
      - patterns:
          - pattern: '"$SQL"'
          - metavariable-regex:
              metavariable: $SQL
              regex: (?is)^.*?\b(insert|update|delete|truncate|copy|merge|alter|drop|grant|revoke|lock)\b.*\bauth_stepup\b
