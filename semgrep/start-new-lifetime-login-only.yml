rules:
  - id: start-new-lifetime-login-only
    languages: [python]
    severity: ERROR
    message: >-
      Only accounts.auth.login renews a session's absolute deadline (spec D6, plan M3 §3 M3d):
      start_new_lifetime() anywhere else would let a session outlive SKIW_SESSION_ABSOLUTE_H
      without a new login. Call accounts.auth.login.login() after both factors are verified.
    paths:
      exclude:
        - /app/accounts/auth/login.py
        - /app/accounts/session.py
        - /app/accounts/tests/
    # The attribute, not only its call: a bound-method alias is caught too (PR 106 review R1 P3 #2).
    pattern-either:
      - pattern: $SESSION.start_new_lifetime
      - pattern: $SESSION.astart_new_lifetime
      - pattern: getattr($SESSION, "start_new_lifetime")
      - pattern: getattr($SESSION, "astart_new_lifetime")
