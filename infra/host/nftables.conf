#!/usr/sbin/nft -f
# Rendered by infra/host/apply from env/<environment>.env (spec §8.4 H2). Do not edit on the host.
# Replaces only table inet skiw: Docker's own tables stay. Caddy's 80/443 reach it through
# Docker's DNAT, so the per-source limit on them is in the forward chain too.
table inet skiw
delete table inet skiw
table inet skiw {
	set ssh4 { type ipv4_addr; flags dynamic; timeout 10m; }
	set ssh6 { type ipv6_addr; flags dynamic; timeout 10m; }
	set web4 { type ipv4_addr; flags dynamic; timeout 10m; }
	set web6 { type ipv6_addr; flags dynamic; timeout 10m; }

	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept
		meta l4proto { icmp, ipv6-icmp } accept
		tcp dport $ssh_port ct state new update @ssh4 { ip saddr limit rate over $ssh_rate } drop
		tcp dport $ssh_port ct state new update @ssh6 { ip6 saddr limit rate over $ssh_rate } drop
$ssh_accept
		tcp dport { 80, 443 } ct state new update @web4 { ip saddr limit rate over $web_rate } drop
		tcp dport { 80, 443 } ct state new update @web6 { ip6 saddr limit rate over $web_rate } drop
		tcp dport { 80, 443 } accept
	}

	chain forward {
		type filter hook forward priority filter; policy accept;
		ct original proto-dst { 80, 443 } ct state new update @web4 { ip saddr limit rate over $web_rate } drop
		ct original proto-dst { 80, 443 } ct state new update @web6 { ip6 saddr limit rate over $web_rate } drop
	}
}
