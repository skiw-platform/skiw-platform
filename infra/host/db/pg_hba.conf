# Template (spec §8.4 H6; TEN-02, TEN-10). `bootstrap-db prepare` fills the placeholders from
# the host's env/<environment>.env (the same subnets Compose gives the networks) and writes
# /etc/skiw/db/pg_hba.conf, which Compose mounts read-only into `db`. No hostname, no secret.
# First matching line wins; anything not allowed above the last two lines is rejected.
# TYPE  DATABASE             USER           ADDRESS          METHOD
local   all                  postgres                        scram-sha-256
local   ${SKIW_POSTGRES_DB}  skiw_readonly                   scram-sha-256
host    ${SKIW_POSTGRES_DB}  skiw_app       ${SKIW_NET_APP}  scram-sha-256
host    ${SKIW_POSTGRES_DB}  skiw_migrator  ${SKIW_NET_APP}  scram-sha-256
host    ${SKIW_POSTGRES_DB}  skiw_backup    ${SKIW_NET_OPS}  scram-sha-256
local   all                  all                             reject
host    all                  all            all              reject
