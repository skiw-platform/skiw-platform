# gitleaks config (UNI-07). Defaults plus the secret key names of agents/PROJECT.md §7.
# Names alone are allowed (docs describe them); a literal value assigned to one is a finding.

[extend]
useDefault = true

[[rules]]
id = "skiw-secret-key-assignment"
description = "A SKIW secret key name assigned a literal value"
regex = '''(?i)(CRED_ENC_KEY|SUPABASE_SERVICE_KEY|ANTHROPIC_API_KEY|GAS_PROOF_URL|tenant_token_key|tenant_source_key|login_blob_key|approval_mac_key|audit_mac_key|private_key_id)["']?\s*[:=]\s*["']?[A-Za-z0-9+/_.:=-]{16,}'''
keywords = ["cred_enc_key", "supabase_service_key", "anthropic_api_key", "gas_proof_url", "tenant_token_key", "tenant_source_key", "login_blob_key", "approval_mac_key", "audit_mac_key", "private_key_id"]

# The spec documents these names; this exempts only the rule above there. Default rules still scan it.
[[allowlists]]
description = "Documented key names in the spec"
targetRules = ["skiw-secret-key-assignment"]
paths = ['''^docs/specs/''']
