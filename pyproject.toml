[project]
name = "skiw-platform"
version = "0.0.0"
description = "SKIW platform: modular Django monolith (spec docs/specs/2026-10-05-skiw-platform-stack-design.md)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Django==5.2.17",
    "psycopg[binary,pool]==3.3.6",
    "gunicorn==26.2.0",
    "uvicorn==0.54.0",
    "uvicorn-worker==0.4.0",
    "procrastinate[django]==3.10.0",
    "cryptography==50.0.2",
    "argon2-cffi==25.1.0",
    "webauthn==3.0.1",
]

[dependency-groups]
dev = [
    "django-stubs==5.2.9",
    "django-stubs-ext==6.1.2",
    "mypy==1.19.1",
    "ruff==0.16.10",
    "import-linter==2.15",
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "django-migration-linter==6.0.0",
]

[tool.uv]
default-groups = ["dev"]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "infra/host"]
# The owner's deploy wrapper has no .py suffix (plan §3 M1h); ruff does not find it on its own.
extend-include = ["scripts/deploy-prod"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"app/**/tests/**" = ["S101", "S105", "S603"]
"app/tests/**" = ["S101", "S105", "S603"]
"infra/host/tests/**" = ["S101", "S603"]
"app/*/migrations/**" = ["RUF012"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "app:infra/host"
explicit_package_bases = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
pythonpath = ["app"]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["app", "infra/host/tests"]
addopts = "-ra --strict-markers -m 'not live and not secrets and not host_live'"
markers = [
    "live: needs the Compose database (make test-live)",
    "secrets: needs the gitleaks binary (make secrets-test)",
    "host_live: needs a Docker daemon; runs the host stack (make host-test-live)",
]

[tool.importlinter]
root_packages = [
    "config", "health", "shell", "jobs", "documents", "accounts", "tenancy", "skiw_host",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Apps do not reach into config internals"
type = "forbidden"
source_modules = ["health", "shell", "jobs", "documents", "accounts", "tenancy"]
forbidden_modules = ["config"]

[[tool.importlinter.contracts]]
name = "Only the DB boundary packages may import psycopg (TEN-10 prep)"
type = "forbidden"
source_modules = ["config", "health", "shell"]
forbidden_modules = ["psycopg"]

[[tool.importlinter.contracts]]
name = "Only accounts may import py_webauthn, the passkey ceremonies (plan M3g)"
type = "forbidden"
source_modules = ["config", "health", "shell", "jobs", "documents", "tenancy"]
forbidden_modules = ["webauthn"]

[[tool.importlinter.contracts]]
name = "Apps other than jobs do not import Procrastinate (spec D5)"
type = "forbidden"
source_modules = ["health", "shell", "documents", "accounts", "tenancy"]
forbidden_modules = ["procrastinate"]

[[tool.importlinter.contracts]]
# tenancy is the shared bottom layer (plan M4-core): every app may import it, it imports none.
name = "config sits above the apps, tenancy below them"
type = "layers"
layers = ["config", "health | shell | jobs | documents | accounts", "tenancy"]

[[tool.importlinter.contracts]]
name = "App modules are independent of each other"
type = "independence"
modules = ["health", "shell", "jobs", "documents", "accounts"]

[[tool.importlinter.contracts]]
name = "Host tooling imports no app package or app dependency (UNI-04; stdlib only)"
type = "forbidden"
source_modules = ["skiw_host"]
forbidden_modules = [
    "config", "health", "shell", "jobs", "documents", "accounts", "tenancy", "django",
    "psycopg", "procrastinate",
]

[[tool.importlinter.contracts]]
name = "App packages do not import host tooling (UNI-04)"
type = "forbidden"
source_modules = ["config", "health", "shell", "jobs", "documents", "accounts", "tenancy"]
forbidden_modules = ["skiw_host"]

# The files volume (spec §8.4 H5, UNI-04). import-linter sees imports, not setting use: the
# Semgrep rule files-volume-only-storage rejects FILES_ROOT, SKIW_FILES_ROOT and /srv/files
# outside documents.storage, and documents-storage-no-db rejects django.db there.
[[tool.importlinter.contracts]]
name = "Only documents may import documents.storage, the files volume module (UNI-04)"
type = "forbidden"
source_modules = ["config", "health", "shell", "jobs", "accounts", "tenancy", "skiw_host"]
forbidden_modules = ["documents.storage"]

[[tool.importlinter.contracts]]
name = "documents.storage and documents.clamd touch no database (TEN-10)"
type = "forbidden"
source_modules = ["documents.storage", "documents.clamd"]
forbidden_modules = ["psycopg", "procrastinate"]

# TEN-10 allow-list (spec §4.1 `django_session`, §4.2): only accounts touches the session table.
# One named edge (owner Q10 (a), plan M3 §3 M3a): config.urls mounts accounts.views, whose login
# views reach accounts.session. Semgrep config-accounts-imports keeps every other config import of
# accounts out (asgi.py -> accounts.source_key, M2c, aside). An unmatched ignore is an error again
# now that config.urls imports accounts.views (the login route, M3e-2).
[[tool.importlinter.contracts]]
name = "Only accounts may import the session store and its model (TEN-10)"
type = "forbidden"
source_modules = ["config", "health", "shell", "jobs", "documents", "tenancy", "skiw_host"]
forbidden_modules = ["accounts.session", "accounts.session_model", "accounts.models"]
ignore_imports = ["config.urls -> accounts.views"]
